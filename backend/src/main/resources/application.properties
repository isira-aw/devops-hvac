# Server Configuration
server.port=${SERVER_PORT:8080}

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hvac_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:123456789}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# MQTT Configuration (External Broker)
mqtt.broker.url=tcp://${MOSQUITTO_HOST:trolley.proxy.rlwy.net}:${MOSQUITTO_PORT:26703}
mqtt.broker.username=${MOSQUITTO_USERNAME:generator-monitoring-system}
mqtt.broker.password=${MOSQUITTO_PASSWORD:}
mqtt.client.id=hvac-backend-${random.uuid}
mqtt.topic.telemetry=hvac/+/telemetry
mqtt.topic.control=hvac/{device_id}/control
mqtt.topic.status=hvac/+/status

# JWT Configuration
jwt.secret=${JWT_SECRET:0000120012002120013303232303232303232303232320323230323230323223232032}
jwt.expiration=${JWT_EXPIRATION:21600000}

# Brevo Email API Configuration (for 2FA)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:no-reply@yourdomain.com}
brevo.sender.name=${BREVO_SENDER_NAME:HVAC System}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# Telemetry Retention (7 days)
telemetry.retention.days=7

# Gemini AI API
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.0-flash}

# Logging
logging.level.com.hvac=INFO
logging.level.org.eclipse.paho=WARN

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Actuator (Health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
