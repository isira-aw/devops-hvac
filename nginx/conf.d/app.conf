# ------------------------------------------------------------------
# HTTP -> HTTPS redirect + ACME challenge for SSL renewal
# ------------------------------------------------------------------
server {
    listen 80;
    server_name live-ac.tech www.live-ac.tech api.live-ac.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------
# Frontend (Customer Portal) - live-ac.tech / www.live-ac.tech
# ------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name live-ac.tech www.live-ac.tech;

    ssl_certificate     /etc/letsencrypt/live/live-ac.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live-ac.tech/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    location / {
        proxy_pass http://customer-portal:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# ------------------------------------------------------------------
# Backend API - api.live-ac.tech
# ------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.live-ac.tech;

    ssl_certificate     /etc/letsencrypt/live/live-ac.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live-ac.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Allow larger request bodies (file uploads, telemetry batches)
    client_max_body_size 10M;

    location / {
        proxy_pass http://backend:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffering for stable upstream communication
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # Health check endpoint (no access log noise)
    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        access_log off;
    }
}
