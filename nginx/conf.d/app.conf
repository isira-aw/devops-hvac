server {
    listen 80;
    server_name live-ac.tech www.live-ac.tech api.live-ac.tech;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name live-ac.tech www.live-ac.tech;

    ssl_certificate /etc/letsencrypt/live/live-ac.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live-ac.tech/privkey.pem;

    # SSL parameters can be added here (e.g., using include /etc/letsencrypt/options-ssl-nginx.conf;)

    location / {
        proxy_pass http://customer-portal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.live-ac.tech;

    ssl_certificate /etc/letsencrypt/live/live-ac.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live-ac.tech/privkey.pem;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
