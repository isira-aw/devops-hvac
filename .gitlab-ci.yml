stages:
  - deploy

variables:
  SSH_HOST: "64.227.144.94"
  SSH_USER: "root"
  WORK_DIRECTORY: "/opt/achvac/AC_contoler_HVAC"
  MAIN_BRANCH: "main"

deploy-production:
  stage: deploy
  image: alpine:latest
  tags:
    - production

  before_script:
    # Install required packages
    - apk add --no-cache openssh-client git
    # Start SSH agent
    - eval $(ssh-agent -s)
    # Setup SSH directory
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Add private key
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - echo "" >> ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    # Add server to known hosts
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

  script:
    - echo "🚀 Deploying project to $SSH_HOST..."
    - |
      ssh $SSH_USER@$SSH_HOST << 'ENDSSH'
        set -e

        echo "📂 Ensuring project directory exists..."
        mkdir -p $WORK_DIRECTORY
        cd $WORK_DIRECTORY

        # Pull latest code
        if [ -d .git ]; then
          echo "📥 Updating repository..."
          git fetch origin $MAIN_BRANCH
          git reset --hard origin/$MAIN_BRANCH
        else
          echo "❌ Git repository not found. Please run initial setup or git clone manually."
          exit 1
        fi

        # Generate .env file securely
        echo "🧾 Updating .env file..."
        cat <<ENV > .env
          DB_NAME=hvac_db
          SPRING_DATASOURCE_URL=jdbc:postgresql://64.227.144.94:5432/hvac_db
          DB_USERNAME=postgres
          DB_PASSWORD=123456789

          MOSQUITTO_HOST=trolley.proxy.rlwy.net
          MOSQUITTO_PORT=26703
          MOSQUITTO_USERNAME=generator-monitoring-system
          MOSQUITTO_PASSWORD=di1u5ydet0z049vbbl08cofp6vhya45l

          JWT_SECRET=0000120012002120013303232303232303232303232320323230323230323223232032
          JWT_EXPIRATION=21600000

          MAIL_HOST=smtp.gmail.com
          MAIL_PORT=465
          MAIL_USERNAME=isira.aw@gmail.com
          MAIL_PASSWORD=cedm mgtv ykaq bgcz

          GOOGLE_CLIENT_ID=539258156026-nq4dck1qtvsj3mb490km8t6pknpb3l30.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=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

          CORS_ALLOWED_ORIGINS=https://live-ac.tech,https://www.live-ac.tech,https://poetic-creativity-production.up.railway.app

