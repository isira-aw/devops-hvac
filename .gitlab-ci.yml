# =============================================================================
# HVAC System - GitLab CI/CD Pipeline
# =============================================================================
# IMPORTANT: All sensitive values must be stored as GitLab CI/CD Variables.
# Go to: Settings > CI/CD > Variables (see SETUP.md for the full list).
# The .env file is generated on the server during deployment from those variables.
# =============================================================================

stages:
  - test
  - deploy

variables:
  SSH_HOST: "64.227.144.94"
  SSH_USER: "root"
  WORK_DIRECTORY: "/opt/hvac"
  DEPLOY_BRANCH: "main"

# =============================================================================
# Stage 1: Validate (runs on every push and merge request)
# =============================================================================
validate-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn compile -B -q
  only:
    - main
    - merge_requests

validate-frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd customer_portal
    - npm ci --silent
    - npm run build
  only:
    - main
    - merge_requests

# =============================================================================
# Stage 2: Deploy to Production (only on main branch, after tests pass)
# =============================================================================
deploy-production:
  stage: deploy
  image: alpine:latest
  tags:
    - production
  environment:
    name: production
    url: https://$DOMAIN

  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - echo "" >> ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null

  script:
    - echo "Deploying to $SSH_HOST..."

    # Build the .env file on the CI runner (no indentation issues)
    - echo "DB_NAME=${DB_NAME}" > /tmp/env_file
    - echo "DB_USERNAME=${DB_USERNAME}" >> /tmp/env_file
    - echo "DB_PASSWORD=${DB_PASSWORD}" >> /tmp/env_file
    - echo "SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME}" >> /tmp/env_file
    - echo "MOSQUITTO_HOST=${MOSQUITTO_HOST}" >> /tmp/env_file
    - echo "MOSQUITTO_PORT=${MOSQUITTO_PORT}" >> /tmp/env_file
    - echo "MOSQUITTO_USERNAME=${MOSQUITTO_USERNAME}" >> /tmp/env_file
    - echo "MOSQUITTO_PASSWORD=${MOSQUITTO_PASSWORD}" >> /tmp/env_file
    - echo "JWT_SECRET=${JWT_SECRET}" >> /tmp/env_file
    - echo "JWT_EXPIRATION=${JWT_EXPIRATION}" >> /tmp/env_file
    - echo "MAIL_HOST=${MAIL_HOST}" >> /tmp/env_file
    - echo "MAIL_PORT=${MAIL_PORT}" >> /tmp/env_file
    - echo "MAIL_USERNAME=${MAIL_USERNAME}" >> /tmp/env_file
    - echo "MAIL_PASSWORD=${MAIL_PASSWORD}" >> /tmp/env_file
    - echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> /tmp/env_file
    - echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" >> /tmp/env_file
    - echo "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}" >> /tmp/env_file
    - echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" >> /tmp/env_file
    - echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> /tmp/env_file
    - echo "DOMAIN=${DOMAIN}" >> /tmp/env_file
    - echo "API_DOMAIN=${API_DOMAIN}" >> /tmp/env_file

    # Ensure project directory exists on the server
    - ssh $SSH_USER@$SSH_HOST "mkdir -p $WORK_DIRECTORY"

    # Transfer .env file to the server
    - scp /tmp/env_file $SSH_USER@$SSH_HOST:$WORK_DIRECTORY/.env

    # Pull code and deploy on the server
    - |
      ssh $SSH_USER@$SSH_HOST "
        set -e
        cd $WORK_DIRECTORY

        if [ -d .git ]; then
          echo '--- Pulling latest code ---'
          git fetch origin $DEPLOY_BRANCH
          git reset --hard origin/$DEPLOY_BRANCH
        else
          echo '--- Cloning repository ---'
          git clone --branch $DEPLOY_BRANCH $CI_REPOSITORY_URL .
        fi

        echo '--- Running deployment ---'
        chmod +x deploy.sh
        ./deploy.sh force
      "

    - echo "Deployment completed successfully."

  only:
    - main
